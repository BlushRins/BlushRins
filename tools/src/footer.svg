<svg xmlns="http://www.w3.org/2000/svg" width="540" height="64" viewBox="0 0 540 64" role="img" aria-label="Thanks for stopping by">
  <title>Thanks for stopping by</title>
  <defs>
    <linearGradient id="line-l" x1="0" x2="1"><stop offset="0" stop-color="#987285" stop-opacity="0"/><stop offset="1" stop-color="#987285" stop-opacity=".7"/></linearGradient>
    <linearGradient id="line-r" x1="0" x2="1"><stop offset="0" stop-color="#987285" stop-opacity=".7"/><stop offset="1" stop-color="#987285" stop-opacity="0"/></linearGradient>
    <style>
      .star { transform-origin: 270px 16px; animation: glow 5s ease-in-out infinite; }
      @keyframes glow { 50% { opacity: .45; transform: scale(.85); } }
      .caret { animation: caret 1.1s steps(1) infinite; }
      @keyframes caret { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
