<svg xmlns="http://www.w3.org/2000/svg" width="540" height="124" viewBox="0 0 540 124" role="img" aria-labelledby="lt-title lt-desc">
  <title id="lt-title">Lift Tracker logged set preview</title>
  <desc id="lt-desc">Retro CRT card showing Squat, 20 kg times 5 reps, saved offline on device.</desc>
  <defs>
    <linearGradient id="lt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d30"/>
      <stop offset="1" stop-color="#362638"/>
    </linearGradient>
    <style>
      .led-halo {
        transform-origin: 412px 22px;
        animation: led-breathe 4.2s ease-in-out infinite;
      }
      @keyframes led-breathe {
        0%, 100% { opacity: .2; transform: scale(.88); }
        50% { opacity: .55; transform: scale(1.18); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="538" height="122" rx="12" fill="url(#lt-bg)" stroke="#5b4760" stroke-width="1.5"/>
  <path d="M11 21V11h10M519 11h10v10M11 103v10h10M529 103v10h-10" fill="none" stroke="#987285" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="18" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#d9bec9">TODAY · LOGGED SET 1</text>

  <circle class="led-halo" cx="412" cy="22" r="7" fill="#96c99b" opacity=".28"/>
  <circle cx="412" cy="22" r="3.5" fill="#c6ecb8"/>
  <text x="424" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#c5eecb">Saved offline</text>

  <rect x="18" y="40" width="504" height="66" rx="9" fill="#243733" stroke="#577467" stroke-width="1.2"/>
  <rect x="30" y="52" width="4" height="42" rx="2" fill="#f7b5ca"/>

  <text x="46" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="bold" fill="#fff1e1">Squat</text>
  <text x="46" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#97c4ab">Set 1 · Stored locally on device</text>

  <rect x="322" y="56" width="78" height="34" rx="6" fill="#2f4a43" stroke="#5d7f70" stroke-width="1.2"/>
  <text x="361" y="78" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="bold" fill="#f7c2d3">20 kg</text>

  <text x="412" y="78" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#97c4ab">×</text>

  <rect x="424" y="56" width="84" height="34" rx="6" fill="#2f4a43" stroke="#5d7f70" stroke-width="1.2"/>
  <text x="466" y="78" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14.5" font-weight="bold" fill="#e6f6b9">5 reps</text>
</svg>
