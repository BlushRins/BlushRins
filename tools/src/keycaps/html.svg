<svg role="img" xmlns="http://www.w3.org/2000/svg" width="80" height="70" viewBox="0 0 80 70">
  <title>HTML</title>
  <style>
    .cap { animation: press 10.4s ease-in-out 4.9s infinite; }
    .bevel { animation: bevel 10.4s ease-in-out 4.9s infinite; }
    .glow { animation: glow 10.4s ease-in-out 4.9s infinite; }
    @keyframes press { 0%,84%,97%,100% { transform:translateY(0) } 89%,93% { transform:translateY(2.2px) } }
    @keyframes bevel { 0%,84%,97%,100% { fill:#846575 } 89%,93% { fill:#684e5d } }
    @keyframes glow { 0%,83%,98%,100% { opacity:0 } 89%,93% { opacity:.62 } }
    @media (prefers-reduced-motion:reduce) { * { animation:none!important } }
  </style>
  <g transform="translate(1 2)" fill="#352733">
    <rect class="glow" x="-1" y="-1" width="78" height="62" rx="9" fill="none" stroke="#df8fa8" stroke-width="2.5" opacity="0"/>
    <rect class="bevel" x="1" y="4" width="76" height="58" rx="8" fill="#846575" stroke="#382c39" stroke-width="2"/>
    <g class="cap">
      <rect width="75" height="55" rx="7" fill="#f2c5af" stroke="#382c39" stroke-width="2"/>
      <path d="M9 3.5h57" fill="none" stroke="#ffffff" stroke-opacity=".42" stroke-width="1.5" stroke-linecap="round"/>
      <text x="8" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" fill="#7a5f70">.html</text>
      <text x="37.5" y="39" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="bold">HTML</text>
    </g>
