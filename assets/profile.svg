<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="240" viewBox="0 0 1080 240" role="img" aria-labelledby="title desc">
  <title id="title">BlushRins — software and study notes</title>
  <desc id="desc">An ink wordmark on blush paper beside three linked nodes drawn on a dot grid.</desc>
