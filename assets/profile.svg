<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">BlushRins — software developer in the making</title>
  <desc id="desc">A rose-coloured desktop computer types a C pointer assignment and traces a linked list on its green phosphor screen.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2=".25" gradientUnits="objectBoundingBox">
      <stop stop-color="#241d30"/><stop offset=".65" stop-color="#362638"/><stop offset="1" stop-color="#4b3249"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#bd8a9f" stroke-width="1" opacity=".15"/>
    </pattern>
    <pattern id="keys" width="15" height="10" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="12" height="7" rx="1.5" fill="#885b72"/>
      <rect x="1" y="1" width="11" height="5" rx="1" fill="#fae1ce"/>
    </pattern>
    <clipPath id="typing"><rect class="reveal" x="657" y="127" width="172" height="20"/></clipPath>
    <style>
      @keyframes type { 0%,12% { width:0 } 48%,100% { width:172px } }
      @keyframes trace { 0%,52% { transform:translateX(0) } 58%,70% { transform:translateX(56px) } 76%,100% { transform:translateX(112px) } }
      @media (prefers-reduced-motion:no-preference) {
        .reveal { animation:type 8s steps(18,end) infinite }
        .pointer { animation:trace 8s ease-in-out infinite }
      }
    </style>
  </defs>
  <rect width="1000" height="320" rx="12" fill="url(#night)"/>
  <path d="M530 0h458q12 0 12 12v296q0 12-12 12H530z" fill="url(#grid)"/>
  <g fill="none" stroke="#987285">
    <path d="M29 45V28h17m925 0h-17m17 0v17M29 275v17h17m925-17v17h-17"/>
    <path d="M50 248h430" opacity=".48"/>
  </g>
  <g font-family="ui-monospace,monospace">
    <text x="51" y="88" fill="#e9b7c8" font-size="21">~/blushrins</text>
    <text x="49" y="228" fill="#fae6db" font-size="23">Software developer in the making</text>
  </g>
  <text x="45" y="185" font-family="Inter,Arial,sans-serif" font-weight="650" font-size="91" letter-spacing="-5" fill="#fff1e1">Blush<tspan font-family="Georgia,'Liberation Serif',serif" font-style="italic" font-weight="400" fill="#f6b7c7">Rins</tspan></text>
  <!-- Desktop and coiled keyboard cable -->
  <ellipse cx="766" cy="276" rx="179" ry="16" fill="#251d2b" opacity=".75"/>
  <path d="M895 245c54 4 57-23 32-23-20 0-12 27 12 20 24-7 8-31-35-33" fill="none" stroke="#d195aa" stroke-width="4"/>
  <!-- CRT enclosure, vented side panel, and foot -->
  <g stroke="#251d2b" stroke-width="3" stroke-linejoin="round">
    <path d="M675 211h143l15 15-11 9H668l-9-8z" fill="#ae7e90"/>
    <path d="M621 67l25-20h239q8 0 10 9l10 129-24 23z" fill="#e2acc0"/>
    <path d="M868 70l25-18 12 133-27 29z" fill="#a5748c"/>
    <path d="M623 66h241q8 0 9 10l6 126q1 12-10 12H627q-10 0-10-11l-3-126q0-11 9-11z" fill="#f4cbbd"/>
  </g>
  <path d="M885 85l7-6m-6 14 7-6m-6 14 7-6m-6 14 7-6m-6 14 7-6" fill="none" stroke="#644456" stroke-width="3" stroke-linecap="round"/>
  <rect x="632" y="79" width="225" height="110" rx="12" fill="#ab8290"/>
  <rect x="636" y="82" width="216" height="103" rx="10" fill="#243733"/>
  <g font-family="ui-monospace,monospace" fill="#c5eecb">
    <text x="651" y="110" font-size="15" fill="#97c4ab">list.c</text>
    <path d="M652 118h183" stroke="#577467"/>
    <text x="657" y="143" font-size="15" textLength="162" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing)">node = node-&gt;next;</text>
  </g>
  <g fill="none" stroke="#8cb89b" stroke-width="2">
    <path d="M679 160h39m-5-4 5 4-5 4m22-4h39m-5-4 5 4-5 4"/>
    <rect x="661" y="153" width="18" height="14" rx="2"/><rect x="717" y="153" width="18" height="14" rx="2"/><rect x="773" y="153" width="18" height="14" rx="2"/>
  </g>
  <rect class="pointer" x="664" y="156" width="12" height="8" rx="1" fill="#e6f6b9"/>
  <path d="M638 201h34m5 0h8" stroke="#a77885" stroke-width="3"/>
  <circle cx="842" cy="200" r="3.5" fill="#496b59"/>
  <!-- Perspective keyboard with a separate space bar -->
  <path d="M639 232h216l40 32v10H599v-10z" fill="#a97787" stroke="#251d2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M639 231h216l40 33H599z" fill="#eab8ac" stroke="#251d2b" stroke-width="2.5" stroke-linejoin="round"/>
  <g transform="matrix(1 0 -.78 .68 640 235)">
    <rect width="179" height="30" fill="url(#keys)"/>
    <rect x="45" y="22" width="75" height="5" rx="1" fill="#fff0db"/>
  </g>
  <path d="M836 250h13l7 5h-14z" fill="#9a576d"/>
</svg>
