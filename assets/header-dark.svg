<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
<title id="title">BlushRins</title><desc id="desc">A minimal GitHub profile banner with subtle blue geometric animations.</desc>
<defs>
 <linearGradient id="accent"><stop stop-color="#62A8FF"/><stop offset="1" stop-color="#A598FF"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1B2940" stroke-width=".6"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="998" height="248" rx="20"/></clipPath>
</defs>
<style>
 .orbit{transform-origin:810px 120px;animation:orbit 38s linear infinite}
 .float{animation:float 7s ease-in-out infinite}
 .pulse{animation:pulse 5s ease-in-out infinite}
 .travel{stroke-dasharray:18 380;animation:travel 13s linear infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes float{50%{transform:translateY(-8px)}}
 @keyframes pulse{50%{opacity:.35}}
 @keyframes travel{to{stroke-dashoffset:-796}}
 @media (prefers-reduced-motion:reduce){.orbit,.float,.pulse,.travel{animation:none}}
</style>
<rect x="1" y="1" width="998" height="248" rx="20" fill="#0D1422" stroke="#26334B"/>
<g clip-path="url(#clip)">
 <rect x="610" y="2" width="388" height="246" fill="url(#grid)" opacity=".65"/>
 <path d="M80 203H920" stroke="#26334B" fill="none"/>
 <path class="travel" d="M80 203H920" stroke="url(#accent)" stroke-width="2" fill="none"/>
 <circle cx="80" cy="76" r="3" fill="#62A8FF" class="pulse"/>
 <text x="94" y="80" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2.6" fill="#8FA2BD">GITHUB PROFILE</text>
 <text x="78" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="58" letter-spacing="-2" fill="#F2F6FF">BlushRins<tspan fill="#729CFF">.</tspan></text>
 <path d="M80 170H125" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
 <g class="float">
  <rect x="758" y="68" width="104" height="104" rx="24" fill="#0D1422" stroke="#26334B" stroke-width="1.5"/>
  <path d="M791 104L777 120L791 136M829 104L843 120L829 136M816 98L804 142" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
 </g>
 <g class="orbit" fill="none" stroke="#759DFA" stroke-width="1" opacity=".48">
  <circle cx="810" cy="120" r="79" stroke-dasharray="3 12"/>
  <circle cx="889" cy="120" r="4" fill="#8A9DFF" stroke="none"/>
  <path d="M807 34H813M810 31V37" stroke-width="1.5"/>
 </g>
 <path d="M669 91H677M673 87V95M911 160H919M915 156V164" stroke="#8FA2BD" opacity=".6"/>
 <circle cx="704" cy="159" r="2" fill="#97A6CB" class="pulse"/>
</g>
</svg>