name: Refresh contribution trail

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-trail

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate rolling 16-week contribution SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_contribution_art.py --owner "${{ github.repository_owner }}" --out assets/contribution --weeks 16

      - name: Commit updated contribution SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution/stats.svg assets/contribution/heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution trail SVGs"
            git push
          fi
