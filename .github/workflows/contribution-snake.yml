name: Refresh contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trace the contribution calendar
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#c6ecb8&color_dots=#3b3444,#6b4262,#a3557a,#d9799f,#f7b5ca

      - name: Match the workbench colors and make a still calendar
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", NS)
          path = Path("dist/snake.svg")
          tree = ET.parse(path)
          svg = tree.getroot()
          svg.set("role", "img")
          x, y, width, height = (float(v) for v in svg.attrib["viewBox"].split())

          panel = ET.Element(f"{{{NS}}}rect", {
              "x": f"{x + 1:g}", "y": f"{y + 1:g}",
              "width": f"{width - 2:g}", "height": f"{height - 2:g}",
              "rx": "12", "fill": "#251f2d",
              "stroke": "#5b4760", "stroke-width": "1.5",
          })
          bx0, by0 = x + 12, y + 12
          bx1, by1 = x + width - 12, y + height - 12
          brackets = ET.Element(f"{{{NS}}}path", {
              "d": (
                  f"M{bx0:g} {by0 + 12:g}V{by0:g}h12"
                  f"M{bx1 - 12:g} {by0:g}h12v12"
                  f"M{bx0:g} {by1 - 12:g}v12h12"
                  f"M{bx1:g} {by1 - 12:g}v12h-12"
              ),
              "fill": "none", "stroke": "#987285",
              "stroke-width": "1.4", "stroke-linecap": "round", "stroke-linejoin": "round",
          })
          svg.insert(0, brackets)
          svg.insert(0, panel)

          rm_style = ET.SubElement(svg, f"{{{NS}}}style")
          rm_style.text = "@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .s, .u { display: none; } }"
          tree.write(path, encoding="utf-8")

          still_style = ET.SubElement(svg, f"{{{NS}}}style")
          still_style.text = "*{animation:none!important}.s,.u{display:none}"
          tree.write("dist/calendar.svg", encoding="utf-8")

      - name: Summarize the past year on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        shell: python
        run: |
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path

          query = """query($login:String!) {
            user(login:$login) { contributionsCollection {
              totalCommitContributions totalPullRequestContributions
              contributionCalendar { totalContributions weeks { contributionDays { contributionCount } } }
            } }
          }"""
          response = subprocess.check_output([
              "gh", "api", "graphql", "-f", f"query={query}", "-f", f"login={os.environ['PROFILE_OWNER']}",
          ])
          activity = json.loads(response)["data"]["user"]["contributionsCollection"]
          calendar = activity["contributionCalendar"]
          days = [day for week in calendar["weeks"] for day in week["contributionDays"]]
          metrics = [
              ("Contributions", calendar["totalContributions"]),
              ("Active days", sum(day["contributionCount"] > 0 for day in days)),
              ("Commits", activity["totalCommitContributions"]),
              ("Pull requests", activity["totalPullRequestContributions"]),
          ]
          summary = ", ".join(f"{value:,} {label.lower()}" for label, value in metrics)
          mono = "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          sans = "-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif"
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          parts = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="720" height="112" viewBox="0 0 720 112" role="img">',
              f"<title>Past year on GitHub — {summary}</title>",
              '<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241d30"/><stop offset="1" stop-color="#362638"/></linearGradient></defs>',
              '<rect x="1" y="1" width="718" height="110" rx="12" fill="url(#bg)" stroke="#5b4760" stroke-width="1.5"/>',
              '<path d="M11 21V11h10M699 11h10v10M11 91v10h10M709 91v10h-10" fill="none" stroke="#987285" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
              f'<text x="700" y="21" text-anchor="end" font-family="{mono}" font-size="10.5" fill="#b89fb2">updated {stamp}</text>',
          ]
          for i, (label, value) in enumerate(metrics):
              x = 26 + i * 180
              if i:
                  parts.append(f'<path d="M{i * 180} 24v64" stroke="#514353" stroke-width="1.2"/>')
              parts.append(f'<text x="{x}" y="60" font-family="{mono}" font-size="35" font-weight="bold" fill="#f7c2d3">{value:,}</text>')
              parts.append(f'<text x="{x}" y="87" font-family="{sans}" font-size="15.5" fill="#f4e2d9">{label}</text>')
          parts.append("</svg>")
          Path("dist/stats.svg").write_text("\n".join(parts) + "\n", encoding="utf-8")

      - name: Publish the calendar images
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: contribution-art
          publish_dir: ./dist
          enable_jekyll: true
          full_commit_message: Refresh contribution calendar
