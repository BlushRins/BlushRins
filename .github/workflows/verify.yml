name: Verify profile artwork
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.68.0
      - run: bash tools/ci-fonts.sh "$RUNNER_TEMP/profile-fonts"
      - run: PROFILE_FONT_ROOT="$RUNNER_TEMP/profile-fonts/usr/share/fonts" python -I tools/build.py --check
